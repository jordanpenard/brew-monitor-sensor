; PlatformIO Project Configuration File
;
;   Docs: https://docs.platformio.org/page/projectconf.html

; Environment: ESP32-C6 Super Mini
[env:esp32-c6-super-mini]
; pioarduino fork bundles Arduino core 3.x, which has reliable ESP32-C6 support
; (the upstream platform only ships the older Arduino 2.x core).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
; There is no registered "Super Mini" board; the DevKitC-1 descriptor matches
; the ESP32-C6 silicon, but it assumes an 8MB flash chip. The C6 Super Mini has
; 4MB, so override the flash size (drop this if your board has 8MB).
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
framework = arduino

; Serial monitor baud rate (must match Serial.begin() in the sketch)
monitor_speed = 115200

; The C6 Super Mini has no external USB-UART chip - it exposes the console over
; the SoC's built-in USB-Serial-JTAG, so Serial must be routed there.
; (ARDUINO_USB_MODE is S2/S3-specific and harmless here; CDC_ON_BOOT is the one
; that enables Serial on the native USB-C port.)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Uncomment and set the correct USB port to upload to your board directly.
; Find it with `pio device list` (e.g. /dev/ttyACM0 or /dev/ttyUSB0).
; upload_port = /dev/ttyACM0

; Dependencies
lib_deps = tzapu/WiFiManager@^2.0.17